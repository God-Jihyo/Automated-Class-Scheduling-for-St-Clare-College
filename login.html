<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCC CLASS SCHEDULER SYSTEM</title>
    <link rel="icon" type="png" href="assets/images/sccicon.png">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="main-container">
        <div class="sidebar">
            <div class="icon-grid">
                <a href="https://www.facebook.com/stclarecollege" class="icon-item" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/scc.jpg" alt="FB Page">
                    <span>Official Facebook Page</span>
                </a>
                <a href="https://www.facebook.com/SCC.CSSociety" class="icon-item" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/comscie icon.jpg" alt="CS Society">
                    <span>Computer Science Society</span>
                </a>
                <a href="https://www.facebook.com/people/BSBA-Society-St-Clare-College/61572670781378/?_rdc=1&_rdr#" class="icon-item" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/ba.jpg" alt="BSBA Society">
                    <span>BSBA Society</span>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61563365184994&mibextid=LQQJ4d&rdid=jmIw4QwQCeTSzcSL&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F18ADciGWMR%2F%3Fmibextid%3DLQQJ4d#" class="icon-item" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/tm.jpg" alt="BS Tourism">
                    <span>BS Tourism Society</span>
                </a>
                <a href="https://www.facebook.com/BSHMDepartmentSCC/" class="icon-item" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/hm.jpg" alt="BSHM">
                    <span>BSHM Department</span>
                </a>
                <a href="https://www.facebook.com/EducSociety2324" class="icon-item" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/educ.jpg" alt="Education">
                    <span>Education Department</span>
                </a>
                <a href="https://stclareonline.com/" class="icon-item wide" target="_blank" rel="noopener noreferrer">
                    <img src="./assets/images/sconline.jpg" alt="Online Edu">
                    <span>St. Clare Online Education</span>
                </a>
            </div>
        </div>

        <div class="login-section">
            <div class="login-box">
                <img src="./assets/images/sccicon.png" alt="St. Clare Logo" class="college-logo">
                <h2>ST. CLARE COLLEGE OF CALOOCAN</h2>
                
                <form id="loginForm" method="POST" action="">
                    <div class="input-group">
                        <input type="email" id="username" name="username" placeholder="Username" required>
                        <i class="fa fa-user"></i>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <i class="fa fa-eye-slash toggle-password" id="togglePassword" title="Toggle Password Visibility"></i>
                    </div>
                    
                        <button type="submit" class="login-btn">LOGIN</button>
                            <a href="#" id="showForgot" style="display: block; margin-top: 15px; font-size: 12px; color: #333; text-decoration: none;">Forgot Password?</a>
                </form>

                <form id="forgotForm" style="display: none;">
                    <p style="font-size: 13px; margin-bottom: 15px; color: #555;">Enter your registered email to receive a reset link.</p>
                    <div class="input-group">
                        <input type="email" id="resetEmail" name="email" placeholder="Registered Email" required>
                        <i class="fa fa-envelope"></i>
                    </div>
                    <button type="submit" class="login-btn">SEND RESET LINK</button>
                    <a href="#" id="backToLogin" style="display: block; margin-top: 15px; font-size: 12px; color: #333; text-decoration: none;">Back to Login</a>
                </form>


            </div>
        </div>
</div>
   <script>
        document.addEventListener('DOMContentLoaded', () => {

        
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the eye / eye-slash icon classes
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });


            document.getElementById("loginForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const form = new FormData(e.target);

           
                let res = await fetch("login.php", {
                    method: "POST",
                    body: form
                });

                let data = await res.json();

                if (data.status === "success") {
                    window.location.href = data.redirect; 
                } else {
                    alert(data.message);
                }
                
                
            });

            // Form Toggling Logic
        const loginForm = document.getElementById('loginForm');
        const forgotForm = document.getElementById('forgotForm');
        const showForgot = document.getElementById('showForgot');
        const backToLogin = document.getElementById('backToLogin');

        showForgot.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            forgotForm.style.display = 'block';
        });

        backToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            forgotForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        // Handle Forgot Password Submit
        forgotForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const submitBtn = forgotForm.querySelector('.login-btn');
            submitBtn.textContent = 'SENDING...';
            submitBtn.disabled = true;

            const form = new FormData(e.target);

            try {
                let res = await fetch("api/forgot_password.php", {
                    method: "POST",
                    body: form
                });

                let data = await res.json();
                alert(data.message);

                if (data.status === "success") {
                    // Reset form and go back to login view
                    forgotForm.reset();
                    forgotForm.style.display = 'none';
                    loginForm.style.display = 'block';
                }
            } catch (error) {
                alert("An error occurred. Please try again.");
            } finally {
                submitBtn.textContent = 'SEND RESET LINK';
                submitBtn.disabled = false;
            }
        });


            
        });

    </script>

</body>
</html>
